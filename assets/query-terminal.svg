<svg width="420" height="402" viewBox="0 0 420 402" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 13px; }
    .title { font-size: 11px; fill: #565f89; }
    .fg { fill: #c0caf5; }
    .kw { fill: #7aa2f7; font-weight: 600; }
    .fn { fill: #e0af68; }
    .prompt { fill: #9ece6a; font-weight: 600; }
    .dim { fill: #565f89; }
    .ok { fill: #9ece6a; }
    .num { fill: #e0af68; }
    .bar { fill: #7aa2f7; transform-origin: 118px 0; transform-box: fill-box; animation: grow 0.5s cubic-bezier(.2,.7,.3,1) both; }
    .line { opacity: 0; animation: show 0.01s step-end both; }
    .cursor { fill: #7aa2f7; }
    @keyframes show { to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.45s; }
    .d4 { animation-delay: 0.6s; } .d5 { animation-delay: 0.75s; }
    .d6 { animation-delay: 0.9s; } .d7 { animation-delay: 1.0s; }
    .d8 { animation-delay: 1.1s; } .d9 { animation-delay: 1.2s; }
    .d10 { animation-delay: 1.5s; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="418" height="400" rx="10" fill="#0b0e14" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="1" y1="36" x2="419" y2="36" stroke="#1f2937" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#f7768e"/>
  <circle cx="42" cy="19" r="6" fill="#e0af68"/>
  <circle cx="62" cy="19" r="6" fill="#9ece6a"/>
  <text x="210" y="23" text-anchor="middle" class="t title">jen@bigquery: ~/queries</text>

  <!-- query -->
  <text x="24" y="68" class="t line d1"><tspan class="prompt">$</tspan><tspan class="fg"> bq query revenue_recovery.sql</tspan></text>
  <text x="24" y="96" class="t line d2"><tspan class="kw">SELECT</tspan><tspan class="fg"> carrier,</tspan></text>
  <text x="24" y="116" class="t line d3"><tspan class="fg">       </tspan><tspan class="fn">SUM</tspan><tspan class="fg">(missed_charges) </tspan><tspan class="kw">AS</tspan><tspan class="fg"> recovered</tspan></text>
  <text x="24" y="136" class="t line d4"><tspan class="kw">FROM</tspan><tspan class="fg"> billing.shipments</tspan></text>
  <text x="24" y="156" class="t line d5"><tspan class="kw">GROUP BY</tspan><tspan class="fg"> 1 </tspan><tspan class="kw">ORDER BY</tspan><tspan class="fg"> 2 </tspan><tspan class="kw">DESC</tspan><tspan class="fg">;</tspan></text>

  <!-- results -->
  <g class="line d6">
    <text x="24" y="196" class="t fg">carrier_a</text>
    <rect class="bar" x="118" y="185" width="180" height="13" rx="2" style="animation-delay: 0.9s"/>
    <text x="306" y="196" class="t num">8.2K</text>
  </g>
  <g class="line d7">
    <text x="24" y="220" class="t fg">carrier_b</text>
    <rect class="bar" x="118" y="209" width="134" height="13" rx="2" style="animation-delay: 1.0s"/>
    <text x="260" y="220" class="t num">6.1K</text>
  </g>
  <g class="line d8">
    <text x="24" y="244" class="t fg">carrier_c</text>
    <rect class="bar" x="118" y="233" width="95" height="13" rx="2" style="animation-delay: 1.1s"/>
    <text x="221" y="244" class="t num">4.3K</text>
  </g>
  <g class="line d9">
    <text x="24" y="268" class="t fg">carrier_d</text>
    <rect class="bar" x="118" y="257" width="64" height="13" rx="2" style="animation-delay: 1.2s"/>
    <text x="190" y="268" class="t num">2.9K</text>
  </g>

  <!-- status -->
  <text x="24" y="308" class="t line d10"><tspan class="ok">✓</tspan><tspan class="fg"> 4 rows · 1.2s elapsed</tspan></text>
  <text x="24" y="328" class="t line d10"><tspan class="dim"># billed missed charges → </tspan><tspan class="ok">+8% gross profit</tspan></text>

  <text x="24" y="366" class="t line d10"><tspan class="prompt">$</tspan></text>
  <rect class="cursor" x="40" y="354" width="9" height="15">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
